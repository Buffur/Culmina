name: astroplan
description: "Culmina: plan astrophotography sessions (what, when, where, with which rig) and log their results."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

# Version and build number: `X.Y.Z+N`. N is the Android versionCode. Both may be
# overridden in `flutter build` with --build-name and --build-number.
version: 1.0.0+2

environment:
  sdk: ^3.13.3

# Review compatible stable releases individually before changing constraints.
# Use targeted upgrades and inspect the resolved lockfile; do not blanket-upgrade
# major versions. Run `flutter pub outdated` to inventory available updates.
dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.5+1
  go_router: ^18.0.1
  drift: ^2.35.3
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  timezone: ^0.11.2
  # Exact pins: each version and licence was reviewed individually when the
  # package was added (device zone, backup/restore); bump deliberately.
  flutter_timezone: 5.1.1
  file_picker: 13.2.0
  archive: 4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # End-to-end suite in integration_test/ (ships with Flutter).
  integration_test:
    sdk: flutter

  # Recommended lint set; activated in analysis_options.yaml.
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:

  # Material Icons font, for the Icons class.
  uses-material-design: true

  # Curated target catalog (CC BY-SA 4.0, see OPENNGC_NOTICE.txt).
  assets:
    - assets/catalog/catalog_v2.json
    - assets/catalog/OPENNGC_NOTICE.txt
    - assets/fonts/OFL-Geist.txt
    - assets/fonts/OFL-SourceSerif4.txt
    - assets/fonts/LICENSE-Lucide.txt

  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    # Retained historical Hybrid font asset; production text roles use Geist.
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
